name: Build and Publish Distributions

on:
  push:
    tags:
      - "v*"

jobs:
  full_tests:
    name: Run full pre-release test suite
    uses: ./.github/workflows/test.yml
    with:
      full: true

  build:
    name: Build universal distributions
    needs: full_tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up minimum supported Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install build toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install "spork-lang>=0.3.7,<0.4" twine

      - name: Verify tag and manifest versions match
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from spork.project.config import ProjectConfig

          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          project_version = ProjectConfig.load().version
          if tag_version != project_version:
              raise SystemExit(
                  f"tag version {tag_version!r} does not match manifest {project_version!r}"
              )
          PY

      - name: Build wheel and source distribution
        run: python -m spork dist --clean

      - name: Check distributions
        run: |
          python -m twine check dist/*
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*-py3-none-any.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

      - name: Verify wheel payload
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          required = {
              "spork_state/__init__.py",
              "spork_state/__init__.pyi",
              "spork_state/core.py",
              "spork_state/core.pyi",
              "spork_state/core.spork",
              "spork_state/core.spork.map.json",
              "spork_state/py.typed",
          }
          with ZipFile(wheel) as archive:
              missing = required.difference(archive.namelist())
          if missing:
              raise SystemExit(f"wheel is missing: {sorted(missing)}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: ./dist/*

  test_wheel:
    name: Test wheel on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Disable the GIL for free-threaded Python
        if: endsWith(matrix.python-version, 't')
        run: echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist

      - name: Install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Smoke-test Python API outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from spork_state import Atom, atom, swap
          from spork_state.core import Atom as CoreAtom

          assert Atom is CoreAtom
          counter = atom(0, lambda value: value >= 0)
          assert swap(counter, lambda value: value + 1) == 1
          assert counter.value == 1
          PY

      - name: Smoke-test installed Spork source discovery
        working-directory: ${{ runner.temp }}
        run: |
          python -m spork -c '(ns release-smoke (:require [spork-state.core :as state])) (def value (state.atom 1)) (assert (= (state.swap! value inc) 2))'

  test_sdist:
    name: Test source distribution
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist

      - name: Build and install from sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz

      - name: Smoke-test installed sdist
        working-directory: ${{ runner.temp }}
        run: python -c "from spork_state import Atom; assert Atom('ready').value == 'ready'"

  publish:
    name: Publish to PyPI
    needs: [build, test_wheel, test_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spork-state
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create GitHub Release
    needs: [build, test_wheel, test_sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
